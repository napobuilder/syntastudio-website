<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Synta Studio</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <!-- Font Awesome, Google Fonts, Tailwind CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Datos Estructurados para SEO -->
    <script type="application/ld+json">
        {{SCHEMA_JSON}}
    </script>

    <style>
        /* --- TODO TU CSS DE SINGLE-POST.HTML VA AQUÍ --- */
        :root {
            --color-primario: #6a11cb;
            --color-secundario: #2575fc;
            --color-fondo: #ffffff;
            --color-fondo-seccion: #f8f9fa;
            --color-texto-principal: #1a1a1a;
            --color-texto-secundario: #4a4a4a;
            --color-borde: #e9ecef;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--color-fondo); color: var(--color-texto-secundario); }
        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; color: var(--color-texto-principal); font-weight: 800; }
        .gradient-text { background: linear-gradient(90deg, var(--color-primario), var(--color-secundario)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .article-content h2 { font-size: 1.875rem; margin-top: 2.5rem; margin-bottom: 1rem; }
        .article-content h3 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.75rem; }
        .article-content p { margin-bottom: 1.5rem; }
        .article-content a { font-weight: 600; text-decoration: underline; color: var(--color-primario); }
        .article-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.5rem; }
        .article-content blockquote { border-left: 4px solid var(--color-primario); padding-left: 1.5rem; margin: 2rem 0; font-style: italic; }
    </style>
</head>
<body>
    <!-- Header (copiado de tu single-post.html) -->
    <header id="header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300">
        <!-- ... tu código de header ... -->
    </header>

    <main class="pt-24">
        <article>
            <header class="py-16 md:py-24 text-center">
                <div class="container mx-auto px-6">
                    <a href="/blog.html" class="font-bold tracking-widest uppercase text-sm mb-4 inline-block gradient-text">{{CATEGORY}}</a>
                    <h1 class="text-4xl md:text-6xl font-black leading-tight mb-6 max-w-4xl mx-auto">{{TITLE}}</h1>
                    <div class="text-[var(--color-texto-secundario)] flex flex-wrap justify-center items-center gap-x-3 gap-y-2">
                        <span>Por {{AUTHOR}}</span><span class="hidden md:inline">•</span><span>{{DATE}}</span><span class="hidden md:inline">•</span><span><i class="far fa-clock mr-1"></i> {{READING_TIME}} min de lectura</span>
                    </div>
                </div>
            </header>
            <div class="container mx-auto -mt-12 px-6">
                <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}" class="rounded-2xl shadow-xl w-full aspect-[2/1] object-cover">
            </div>
            <div class="container mx-auto px-6 py-16 md:py-24">
                <div class="max-w-3xl mx-auto article-content">
                    {{CONTENT_HTML}}
                    
                    <!-- INICIO DE LA NUEVA SECCIÓN DE FAQ -->
                    <div class="mt-16">
                        <h2 class="text-3xl font-bold mb-6">Preguntas Frecuentes</h2>
                        {{FAQ_SECTION_HTML}}
                    </div>
                    <!-- FIN DE LA NUEVA SECCIÓN DE FAQ -->
                </div>
            </div>
        </article>
    </main>

    <!-- Footer (copiado de tu single-post.html) -->
    <footer>
        <!-- ... tu código de footer ... -->
    </footer>
    <!-- Scripts (copiados de tu single-post.html) -->
    <script>
        // ... tu código de JS ...
    </script>
</body>
</html>
