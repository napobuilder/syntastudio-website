name: Synta Studio Content Bot

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  schedule:
    - cron: '0 8 * * 1' # Se ejecuta cada lunes a las 8:00 AM UTC

jobs:
  build-and-publish-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Configurar Git
        run: |
          git config --global user.name "Synta Content Bot"
          git config --global user.email "bot@syntastudio.com"

      - name: Ejecutar el motor de contenidos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: python automation/main.py