<div class="post-card rounded-2xl flex flex-col" data-category="{{CATEGORY_SLUG}}">
    <a href="{{POST_URL}}" class="block overflow-hidden rounded-t-2xl">
        <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}" class="w-full h-48 object-cover">
    </a>
    <div class="p-6 flex flex-col flex-grow">
        <p class="text-sm font-bold gradient-text mb-2 tracking-widest">{{CATEGORY_NAME}}</p>
        <h3 class="text-xl font-bold mb-3 flex-grow">{{TITLE}}</h3>
        <a href="{{POST_URL}}" class="font-semibold mt-4 self-start text-[var(--color-texto-principal)] hover:gradient-text">Leer más →</a>
    </div>
</div>
